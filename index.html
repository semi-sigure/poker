else h=`<div class="oval"><div class="felt"><div class="pot"><i class="chp g"></i><i class="chp g"></i> ポット ${F(P.reduce((s,p)=>s+p.tot,0))}${S.bb?' <small>'+(P.reduce((s,p)=>s+p.tot,0)/S.bb).toFixed(1)+'BB</small>':''}</div>${hnbH()}<div class="board">${[0,1,2,3,4].map(k=>{const c=(S.board||[])[k];return c==null?'<span class="card ph"></span>':cardH(c,0,(HL?(HL.has(c)?'hl':'dim'):'')+(omT&&Date.now()<omT.e&&omT.fk==su(c)?' om':''))}).join('')}</div>${omT&&Date.now()<omT.e?'<div class="omen">'+omT.t+'</div>':''}</div>${P.map(seatH).join('')}</div><div class="sub">${myH()}${awayH()}${reH()}${isHost&&S.phase!='lobby'&&S.phase!='over'?(S.endReq?'<p class="bar">このハンドで終了します</p>':'<div class="ctl"><button onclick="if(confirm(\'現在のハンド終了後にゲームを終了して結果を表示しますか?\'))tx({k:\'end\'})">ゲーム終了</button></div>'):''}</div>${ctl()}${S.msg?'<p class="pot">'+esc(S.msg)+'</p>':''}<div class="log">${(S.log||[]).slice().reverse().map(esc).join('<br>')}</div>${S.phase=='over'?resH():''}${S.phase=='over'&&isHost?'<p><button onclick="reset()">ロビーに戻る</button></p>':''}`;
$('main').innerHTML=h;bgmUpd()}

setInterval(()=>{if(!S.startTs||S.phase=='lobby'){$('bar').innerHTML='';return}const el=Date.now()-S.startTs,l=Math.min(4,el/LVMS|0),r=LVMS-el%LVMS,f=n=>n[0]+'/'+n[1]+(n[2]?' (A:'+n[2]+')':''),m=l<4?String(r/60000|0).padStart(2,'0')+':'+String(r/1000%60|0).padStart(2,'0'):'--:--';
$('bar').innerHTML=`<div>ブラインド <b>${f(LV[l])}</b></div><div>次のブラインド <b class="cd">${m}</b>${l<4?' → '+f(LV[l+1]):'(最終)'}</div><div class="pb"><i style="width:${l<4?(el%LVMS)/LVMS*100:100}%"></i></div><small>Lv${l+1} ・ ハンド#${S.hand||0}</small>`},1000);

render();
</script></body></html>
