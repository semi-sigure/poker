const $=id=>document.getElementById(id),rk=c=>c%13+2,su=c=>c/13|0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

function s5(c){const r=c.map(rk).sort((a,b)=>b-a),fl=c.every(x=>su(x)==su(c[0]));let st=0;if(new Set(r).size==5){if(r[0]-r[4]==4)st=r[0];else if(r[0]==14&&r[1]==5)st=5}
const n={};r.forEach(x=>n[x]=(n[x]||0)+1);const g=Object.entries(n).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),k=g.map(x=>x[1]),a=g[0][0],b=g[1]?g[1][0]:0;

function best5(c){let m=-1,b=null;const n=c.length;(function f(s,a){if(a.length==5){const v=s5(a);if(v>m){m=v;b=a.slice()}return}for(let i=s;i<n;i++){a.push(c[i]);f(i+1,a);a.pop()}})(0,[]);return b}
function eqCalc(holes,board,N){const known=new Set(holes.flat().concat(board)),rest=[];for(let c=0;c<52;c++)if(!known.has(c))rest.push(c);const need=5-board.length,w=holes.map(()=>0);

function om(bd){const sc={},cn={};bd.forEach(c=>{sc[su(c)]=(sc[su(c)]||0)+1;cn[rk(c)]=(cn[rk(c)]||0)+1});let fs=0,fk=-1;for(const k in sc)if(sc[k]>fs){fs=sc[k];fk=+k}
const rs=new Set(bd.map(rk));if(rs.has(14))rs.add(1);let st=0;for(let lo=1;lo<=10;lo++){let n=0;for(let r=lo;r<lo+5;r++)if(rs.has(r))n++;if(n>st)st=n}
return{fs,fk,st,pr:Math.max(0,...Object.values(cn))}}

if(!(b.phase=='show'&&b.reveal&&b.players.some(p=>p.allin&&!p.folded))&&bn>(a.board||[]).length){omen(a,b);const m=b.players.find(p=>p.id==uid);if(m&&m.in&&!m.folded&&m.hole&&m.hole.length&&m.hole[0]>=0){const c0=mineCat(m.hole,a.board||[]),c1=mineCat(m.hole,b.board||[]);if(c1>=4&&c1>c0)lt(HN[c1],c1>=7)}}}

function seatH(p,i){const me=p.id==uid,inH=S.phase!='over'&&p.in&&!p.folded,show=me||(S.reveal&&!p.folded),hu=[...p.name].reduce((q,ch)=>q+ch.charCodeAt(0)*31,0)%360,lb=S.phase!='lobby',la=p.folded&&p.in?'フォールド':(S.phase=='play'||S.phase=='show')&&p.la?p.la:'',tn=S.phase=='play'&&S.turn==i,

function ctl(){const p=S.players[S.turn];if(S.phase!='play')return '';
if(!p||p.id!=uid)return `<div class="pot">${p?esc(p.name)+' の番…':''}</div>`;
const need=S.cur-p.bet,mx=p.bet+p.chips,mn=Math.min(S.cur+S.min,mx);
let h=`<div class="pot">あなたの番です <span id="sec"></span></div><div class="inf">コール額 <b>${F(Math.min(need,p.chips))}</b> ・ ポット <b>${F(S.players.reduce((q,x)=>q+x.tot,0))}</b> ・ あなたのスタック <b>${F(p.chips)}</b></div><div class="ctl"><button class="f" onclick="send('f')">フォールド</button><button onclick="send('c')">${need>0?'コール '+F(Math.min(need,p.chips)):'チェック'}</button></div>`;
if(mx>S.cur){const pot=S.players.reduce((q,p)=>q+p.tot,0);h+=`<div class="ctl"><input type="number" id="rn" min="${mn}" max="${mx}" step="5" value="${mn}" oninput="$('r').value=this.value;$('rt').textContent=F(this.value)"><input type="range" id="r" min="${mn}" max="${mx}" step="5" value="${mn}" oninput="$('rn').value=this.value;$('rt').textContent=F(this.value)"><button class="rz" onclick="send('r',+$('rn').value)">${S.cur?'レイズ':'ベット'} → <b id="rt">${F(mn)}</b></button><button class="a" onclick="send('r',${mx})">オールイン ${F(mx)}</button></div><div class="ctl">${[['1/3',1/3],['1/2',.5],['2/3',2/3],['ポット',1]].map(([l,f])=>`<button onclick="pre(${S.cur+f*(pot+need)})">${l}</button>`).join('')}<button onclick="pre(${S.cur*3||S.bb*3})">3倍</button></div>`}
return '<div class="act">'+h+'</div>'}

function render(){if(!net){$('main').innerHTML=menuH();return}const P=S.players;let h;HL=null;if(S.phase=='show'&&S.reveal&&S.win){HL=new Set();const wn=S.win.map(w=>w.n);P.forEach(p=>{if(wn.includes(p.name)&&!p.folded&&p.hole&&p.hole.length&&p.hole[0]>=0)best5(p.hole.concat(S.board)).forEach(c=>HL.add(c))})}{const n=P.length,mi=Math.max(0,P.findIndex(p=>p.id==uid)),mp={2:[0,2],3:[0,1,3]}[n]||[0,1,2,3];P.forEach((_,i)=>POS[i]=mp[(i-mi+n)%n])}
if(S.phase=='lobby')h=`<h3>ロビー</h3><div class="mem">${MEM.map(m=>{const j=P.some(p=>p.id==m.id);return `<div class="mc ${j?'':'off'}"><img src="/img/${m.img}" alt=""><b>${esc(m.name)}</b><small>${j?(m.id==uid?'あなた':'入室中'):'未入室'}</small></div>`}).join('')}</div><p>${isHost?`<button ${P.length<2?'disabled':''} onclick="start()">ゲーム開始 (${P.length}/4人)</button>`:'ネギおじさんの開始を待っています'}</p><p class="bar">開始スタック ${F(START)}チップ(250BB)・席順は開始時にランダム</p>`;
else h=`<div class="oval"><div class="felt"><div class="pot"><i class="chp g"></i><i class="chp g"></i> ポット ${F(P.reduce((s,p)=>s+p.tot,0))}${S.bb?' <small>'+(P.reduce((s,p)=>s+p.tot,0)/S.bb).toFixed(1)+'BB</small>':''}</div><div class="board">${[0,1,2,3,4].map(k=>{const c=(S.board||[])[k];return c==null?'<span class="card ph"></span>':cardH(c,0,(HL?(HL.has(c)?'hl':'dim'):'')+(omT&&Date.now()<omT.e&&omT.fk==su(c)?' om':''))}).join('')}</div>${omT&&Date.now()<omT.e?'<div class="omen">'+omT.t+'</div>':''}${P.map(posH).join('')}</div>${P.map(seatH).join('')}</div>${myH()}${ctl()}${awayH()}${reH()}${isHost&&S.phase!='lobby'&&S.phase!='over'?(S.endReq?'<p class="bar">このハンドで終了します</p>':'<div class="ctl"><button onclick="if(confirm(\'現在のハンド終了後にゲームを終了して結果を表示しますか?\'))tx({k:\'end\'})">ゲーム終了</button></div>'):''}${S.msg?'<p class="pot">'+esc(S.msg)+'</p>':''}<div class="log">${(S.log||[]).slice().reverse().map(esc).join('<br>')}</div>${S.phase=='over'?resH():''}${S.phase=='over'&&isHost?'<p><button onclick="reset()">ロビーに戻る</button></p>':''}`;
$('main').innerHTML=h}

setInterval(()=>{if(!S.startTs||S.phase=='lobby'){$('bar').innerHTML='';return}const el=Date.now()-S.startTs,l=Math.min(4,el/LVMS|0),r=LVMS-el%LVMS,f=n=>n[0]+'/'+n[1]+(n[2]?' (A:'+n[2]+')':''),m=l<4?String(r/60000|0).padStart(2,'0')+':'+String(r/1000%60|0).padStart(2,'0'):'--:--';
$('bar').innerHTML=`<div>ブラインド <b>${f(LV[l])}</b></div><div>次のブラインド <b class="cd">${m}</b>${l<4?' → '+f(LV[l+1]):'(最終)'}</div><div class="pb"><i style="width:${l<4?(el%LVMS)/LVMS*100:100}%"></i></div><small>Lv${l+1} ・ ハンド#${S.hand||0}</small>`},1000);

render();
</script></body></html>
